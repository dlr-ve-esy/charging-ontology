name: docs 
on:
  push:
    branches:
      - dev 
      - main
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "adopt"
          java-version: "11"
      - name: make
        run: |
          make
      - uses: actions/upload-artifact@master
        with:
          name: build-artifacts
          path: build/chio
  pages:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/download-artifact@master
        with:
          name: build-artifacts
      - name: Build Ontology Pages
        uses: enioarz/ontology-server@781be893bccc210495457ec50198611bd6492ac5
        id: build
        with:
          args: --source ./$(cat VERSION)/chio-full.owx --config ./render-config.toml  --assets ./static build --output ./public --render_imports
      - name: Get the output
        run: echo "${{ steps.build.outputs.results }}"
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: workspace_artifacts
          path: ${{ github.workspace }}/public
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{steps.deployment.outputs.page_url}}
    runs-on: ubuntu-latest
    needs: pages
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
