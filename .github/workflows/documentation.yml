name: docs 
on:
  push:
    branches:
      - dev 
      - main
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "adopt"
          java-version: "11"
      - name: make
        run: |
          make
      - uses: actions/upload-artifact@master
        with:
          name: build-artifacts
          path: build/chio
  pages:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/download-artifact@master
        with:
          name: build-artifacts
      - name: Get version
        run: echo "ONTOLOGY_VERSION=$(cat VERSION)" >> $GITHUB_ENV
      - name: Build Ontology Pages
        uses: enioarz/ontology-server@main
        id: build
        with:
          args: --source ./${{ env.ONTOLOGY_VERSION }}/chio-full.owx --config ./render-config.toml  --assets /static --templates /templates build --output ./public --render_imports
      - name: Get the output
        run: echo "${{ steps.build.outputs.results }}"
      - name: Move Build Artifacts
        run: cp -r ${{ github.workspace }}/public/ ./_site/
      - name: Create version folder
        run: mkdir -p ./_site/releases/${{ env.ONTOLOGY_VERSION }}
      - name: Copy full owx ontology
        run: cp ./${{ env.ONTOLOGY_VERSION }}/chio-full.owx ./_site/releases/${{ env.ONTOLOGY_VERSION }}/chio-full.owx
      - name: Copy full ttl ontology
        run: cp ./${{ env.ONTOLOGY_VERSION }}/chio-full.ttl ./_site/releases/${{ env.ONTOLOGY_VERSION }}/chio-full.ttl
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{steps.deployment.outputs.page_url}}
    runs-on: ubuntu-latest
    needs: pages
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
